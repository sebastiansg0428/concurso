<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo-cafe.svg">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="hero"><h1>Panel de administración</h1></header>
  <main class="container acceso">
    <form id="form-login">
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input id="usuario" type="text" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="clave">Clave</label>
        <input id="clave" type="password" autocomplete="current-password" required>
      </div>
      <div id="mensaje" class="alert error" role="alert" hidden></div>
      <button class="btn" type="submit">Ingresar</button>
    </form>
  </main>
  <script src="/admin/js/acceso.js"></script>
</body>
</html>
