<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Concurso de Cafés</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo-cafe.svg">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="hero admin-bar">
    <h1>☕ Panel del concurso</h1>
    <div><span id="usuario"></span> <button id="btn-salir" class="btn sm sec">Salir</button></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Panel del concurso">
    <button id="pestana-resultados" data-tab="resultados" class="activo" role="tab" aria-selected="true" aria-controls="tab-resultados">Resultados</button>
    <button id="pestana-votantes" data-tab="votantes" role="tab" aria-selected="false" aria-controls="tab-votantes" tabindex="-1">Votantes</button>
    <button id="pestana-cafes" data-tab="cafes" role="tab" aria-selected="false" aria-controls="tab-cafes" tabindex="-1">Bebidas</button>
    <button id="pestana-qr" data-tab="qr" role="tab" aria-selected="false" aria-controls="tab-qr" tabindex="-1">Código QR</button>
  </nav>

  <main class="container wide">
    <div id="mensaje-panel" class="alert error" role="alert" hidden></div>
    <section id="tab-resultados" class="tab" role="tabpanel" aria-labelledby="pestana-resultados" tabindex="0">
      <div class="fila">
        <h2>Resultados <small id="total" class="muted"></small></h2>
        <button id="btn-refrescar" class="btn sm sec">Actualizar</button>
      </div>
      <div id="resultados"></div>
    </section>

    <section id="tab-votantes" class="tab" role="tabpanel" aria-labelledby="pestana-votantes" tabindex="0" hidden>
      <div class="fila">
        <h2>Votantes</h2>
        <a href="/admin/api/export.csv" class="btn sm">Exportar CSV</a>
      </div>
      <label for="buscar">Buscar votantes</label>
      <input id="buscar" type="search" placeholder="Buscar por nombre, correo, ciudad, bebida o establecimiento…">
      <div class="tabla-wrap">
        <table>
          <thead><tr><th>Fecha</th><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Ciudad</th><th>Bebida</th><th>Establecimiento</th></tr></thead>
          <tbody id="tabla-votantes"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-cafes" class="tab" role="tabpanel" aria-labelledby="pestana-cafes" tabindex="0" hidden>
      <h2 id="titulo-form-cafe">Agregar bebida</h2>
      <form id="form-cafe" class="card">
        <input type="hidden" id="cafe-id">
        <div class="campo">
          <label for="cafe-nombre">Nombre de la bebida</label>
          <input id="cafe-nombre" type="text" maxlength="120" required>
        </div>
        <div class="campo">
          <label for="cafe-establecimiento">Establecimiento</label>
          <input id="cafe-establecimiento" type="text" minlength="2" maxlength="120" required>
        </div>
        <div class="campo">
          <label for="cafe-descripcion">Frase</label>
          <textarea id="cafe-descripcion" rows="3" maxlength="1000"></textarea>
        </div>
        <label class="check"><input id="cafe-activo" type="checkbox" checked> Activo (visible para votar)</label>
        <div class="acciones">
          <button class="btn sm" type="submit">Guardar</button>
          <button class="btn sm sec" type="button" id="btn-cancelar" hidden>Cancelar</button>
        </div>
      </form>
      <div id="msg-cafes" class="alert" hidden></div>
      <div class="tabla-wrap">
        <table>
          <thead><tr><th>Bebida</th><th>Establecimiento</th><th>Frase</th><th>Estado</th><th>Votos</th><th></th></tr></thead>
          <tbody id="tabla-cafes"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-qr" class="tab center" role="tabpanel" aria-labelledby="pestana-qr" tabindex="0" hidden>
      <h2>Código QR para votar</h2>
      <p>Apunta a: <a id="qr-url" target="_blank" rel="noopener"></a></p>
      <img id="qr-img" alt="Código QR" width="300" height="300">
      <p class="muted">Para cambiar la dirección edita <code>PUBLIC_URL</code> en el archivo <code>.env</code> y reinicia el servidor.</p>
      <a href="/admin/api/qr?descargar=1" class="btn sm">Descargar PNG</a>
      <button id="btn-imprimir" class="btn sm sec">Imprimir</button>
    </section>
  </main>

  <script src="/admin/js/admin.js"></script>
</body>
</html>
